name: vectorscale-profile

# Temporary: is the fixed pgvectorscale slower, and if so, which part of the patch does it? Builds the
# unpatched source and patch variants with the same toolchain, then times all of them against the
# released image on one runner, alternating rounds.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - fixes/pgvectorscale/**
      - .github/workflows/vectorscale-profile.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      BASE: timescale/timescaledb-ha:pg17.11-ts2.30.2
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the variants (same toolchain, shared cache)
        run: |
          grep -m1 'model name' /proc/cpuinfo | tee host.txt
          for p in none load-on-any-x86-cpu.patch variant-xor-baseline.patch; do
            docker buildx build -q --load -t "local/vs-${p%.patch}" --build-arg BASE="$BASE" --build-arg PATCH="$p" fixes/pgvectorscale >/dev/null
          done
          docker image ls 'local/vs-*'
      - name: Time every variant, 7 alternating rounds
        run: |
          for round in 1 2 3 4 5 6 7; do
            for img in "$BASE" local/vs-none local/vs-load-on-any-x86-cpu local/vs-variant-xor-baseline; do
              printf '%s\t%s\t%s\n' "${img##*/}" "$round" "$(bash scripts/bench.sh "$img" diskann)" | tee -a times.tsv
            done
          done
      - name: Medians
        if: always()
        run: |
          python3 - <<'EOF' | tee medians.txt
          import collections, statistics
          b, q = collections.defaultdict(list), collections.defaultdict(list)
          for line in open("times.tsv"):
              name, _, build, query = line.rstrip("\n").split("\t")
              b[name].append(int(build)); q[name].append(int(query))
          ref = statistics.median(q["vs-none"])
          for name in b:
              mq = statistics.median(q[name])
              print(f"{name:40s} build {statistics.median(b[name]):>7.0f} ms   queries {mq:>6.0f} ms   "
                    f"({(mq / ref - 1) * 100:+.1f}% vs unpatched same toolchain)   all queries {sorted(q[name])}")
          EOF
          { echo '```'; cat host.txt medians.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
