name: tecnativa-fix

# Evidence for a pull request to Tecnativa/docker-postgres-autoconf: their image built from their own
# commit, unchanged vs with a one-line change to the pgvector make command, compared on
# (1) the exact compiler command, (2) every emulated CPU, (3) code size and speed.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Tecnativa/docker-postgres-autoconf commit to test
        required: false
        default: 0e87caf7ee46a2378999f2194a1e9a072b27f9ed

permissions:
  contents: read

env:
  BASE_TAG: 18-alpine
  # their line (PR #38) and the replacement
  THEIRS: $(if [ "$(uname -m)" = "x86_64" ]; then echo 'CFLAGS=-march=x86-64-v2'; fi)
  FIXED: OPTFLAGS=""

jobs:
  flags:
    runs-on: ubuntu-24.04
    steps:
      - name: Exact compiler command for pgvector's vector.c, three ways
        run: |
          docker run --rm docker.io/postgres:${BASE_TAG} sh -ec '
            PG_CLANG="$(pg_config --configure | tr "'"'"'" "\n" | sed -n "s/^CLANG=clang-//p")"
            PG_LLVM="$(pg_config --configure | tr "'"'"'" "\n" | sed -n "s#^LLVM_CONFIG=/usr/lib/llvm\([0-9][0-9]*\)/bin/llvm-config#\1#p")"
            apk add --no-cache -q build-base linux-headers ca-certificates "clang${PG_CLANG}" "llvm${PG_LLVM}" >/dev/null
            wget -qO- https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.1.tar.gz | tar -xz -C /tmp
            cd /tmp/pgvector-0.8.1
            echo "PostgreSQL CFLAGS (pg_config): $(pg_config --cflags)"
            echo; echo "== Tecnativa today (make CFLAGS=-march=x86-64-v2):"
            make -n CFLAGS=-march=x86-64-v2 PG_CONFIG=/usr/local/bin/pg_config | grep -E "^(gcc|cc) .*src/vector\.c" | head -n1
            echo; echo "== Proposed (make OPTFLAGS=\"\"):"
            make -n OPTFLAGS="" PG_CONFIG=/usr/local/bin/pg_config | grep -E "^(gcc|cc) .*src/vector\.c" | head -n1
            echo; echo "== pgvector default (make):"
            make -n PG_CONFIG=/usr/local/bin/pg_config | grep -E "^(gcc|cc) .*src/vector\.c" | head -n1
          ' | tee flags.txt
          { echo '## Compiler command for vector.c'; echo '```'; cat flags.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: flags
          path: flags.txt

  compare:
    name: compare (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends gdb-multiarch binutils-aarch64-linux-gnu >/dev/null
          sudo sysctl -w kernel.core_pattern=/cores/core.native.%p
      - name: Check out Tecnativa twice, patch one copy
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          git clone -q https://github.com/Tecnativa/docker-postgres-autoconf upstream
          git -C upstream checkout -q "$REF"
          cp -r upstream fixed
          python3 - <<'EOF'
          import os, pathlib
          p = pathlib.Path("fixed/Dockerfile"); s = p.read_text()
          assert s.count(os.environ["THEIRS"]) == 1, "their make line changed upstream; re-check the patch"
          p.write_text(s.replace(os.environ["THEIRS"], os.environ["FIXED"]))
          EOF
          git -C fixed diff | tee patch.diff
      - name: Build both images (their Dockerfile, their base tag)
        run: |
          for v in upstream fixed; do
            docker buildx build -q --platform "linux/${{ matrix.arch }}" --build-arg BASE_TAG="$BASE_TAG" \
              --load -t "local/tecnativa-$v:$BASE_TAG" "$v" >/dev/null
          done
      - name: Audit both on every emulated CPU
        run: |
          for v in upstream fixed; do
            LOCAL_IMAGE=1 bash scripts/probe.sh "local/tecnativa-$v:$BASE_TAG" "${{ matrix.arch }}" "out/$v"
          done
      - name: Code size of vector.so
        run: |
          od="objdump"; sz="size"
          if [ "${{ matrix.arch }}" = arm64 ]; then od="aarch64-linux-gnu-objdump"; sz="aarch64-linux-gnu-size"; fi
          for v in upstream fixed; do
            cid=$(docker create --platform "linux/${{ matrix.arch }}" "local/tecnativa-$v:$BASE_TAG")
            docker cp "$cid:/usr/local/lib/postgresql/vector.so" "out/$v/vector.so" && docker rm "$cid" >/dev/null
            text=$($sz -A "out/$v/vector.so" | awk '$1==".text"{print $2}')
            funcs=$($od -d "out/$v/vector.so" | grep -cE '^[0-9a-f]+ <.*>:$')
            fp=$($od -d "out/$v/vector.so" | grep -cE 'mov +%rsp,%rbp|mov +x29, sp')
            printf '%s\ttext_bytes=%s\tfunctions=%s\tframe_pointer_setups=%s\n' "$v" "$text" "$funcs" "$fp" | tee -a out/size.tsv
          done
      - name: Speed (amd64 natively; same runner, alternating, 5 rounds)
        if: matrix.arch == 'amd64'
        run: |
          grep -m1 'model name' /proc/cpuinfo | tee out/bench-host.txt
          for round in 1 2 3 4 5; do
            for v in upstream fixed; do
              printf '%s\t%s\t%s\n' "$v" "$round" "$(bash scripts/bench.sh "local/tecnativa-$v:$BASE_TAG")" | tee -a out/bench.tsv
            done
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.arch }}"
            echo '```diff'; cat patch.diff; echo '```'
            for v in upstream fixed; do echo "### $v"; echo '```'; cat "out/$v/results.tsv"; cat "out/$v/explain.tsv" 2>/dev/null; cat "out/$v/fingerprint.tsv"; echo '```'; done
            echo '```'; cat out/size.tsv out/bench-host.txt out/bench.tsv 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-${{ matrix.arch }}
          path: |
            out/*/results.tsv
            out/*/info.tsv
            out/*/explain.tsv
            out/*/explain/
            out/*/fingerprint.tsv
            out/*/inner.log
            out/size.tsv
            out/bench*.txt
            out/bench.tsv
            patch.diff
